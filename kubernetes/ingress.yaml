apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app
  namespace: demo-app
  labels:
    app.kubernetes.io/name: demo-app
  annotations:
    # Traefik (k3s default)
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # Uncomment to enable TLS termination via cert-manager:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  # tls:
  #   - hosts:
  #       - demo-app.example.com
  #     secretName: demo-app-tls
  rules:
    - host: demo-app.example.com   # replace with your actual domain or IP
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app
                port:
                  name: http
