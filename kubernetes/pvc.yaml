apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-app-data
  namespace: demo-app
  labels:
    app.kubernetes.io/name: demo-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: standard  # uncomment and adjust for your cluster
