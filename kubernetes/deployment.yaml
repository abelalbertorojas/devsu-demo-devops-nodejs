apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo-app
  labels:
    app.kubernetes.io/name: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # NOTE: SQLite es una base de datos basada en archivos con file locking. 
      # Con múltiples réplicas compartiendo en el mismo PVC (ReadWriteOnce), 
      # pueden competir por los locks de archivos y corromper los datos bajo 
      # escrituras concurrentes. Para producción, migra a PostgreSQL o MySQL y elimina el volumen PVC a continuación.
      
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: demo-app-data

      containers:
        - name: demo-app
          image: ghcr.io/abelalbertorojas/devsu-demo-devops-nodejs:develop
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: demo-app-config
            - secretRef:
                name: demo-app-secret

          volumeMounts:
            - name: data
              mountPath: /app/data

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          livenessProbe:
            httpGet:
              path: /api/users
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/users
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
